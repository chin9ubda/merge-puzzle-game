<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Merge 2048 — 무한 머지 퍼즐</title>
<style>
  :root {
    --bg: #faf8ef;
    --board: #bbada0;
    --empty: #cdc1b4;
    --text: #776e65;
    --accent: #8f7a66;
    --ad-h: 90px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Clear Sans", "Helvetica Neue", Arial, "Apple SD Gothic Neo", sans-serif;
    min-height: 100%;
    overscroll-behavior: none;
  }
  body {
    display: flex; flex-direction: column; align-items: center;
    padding: 8px; gap: 8px;
  }
  /* ---- 광고 영역 (상단/하단 공통) ---- */
  .ad-slot {
    width: 100%; max-width: 480px;
    min-height: var(--ad-h); height: var(--ad-h);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    flex: 0 0 auto;
  }
  .ad-placeholder {
    width: 100%; height: 100%;
    border: 2px dashed #b8ac9e;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: #a89c8e; font-size: 13px; letter-spacing: 1px;
    background: #f3efe6;
  }
  /* ---- 헤더 ---- */
  .app { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 8px; }
  .topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
  .title { font-size: 30px; font-weight: 800; color: var(--text); line-height: 1; }
  .subtitle { font-size: 11px; color: #9a8f82; margin-top: 4px; }
  .scores { display: flex; gap: 8px; }
  .score-box {
    background: #7a6a58; color: #fff; border-radius: 6px;
    padding: 6px 12px; min-width: 72px; text-align: center;
  }
  .score-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #f5f0e6; }
  .score-val { font-size: 20px; font-weight: 800; }
  /* ---- 컨트롤 ---- */
  .controls { display: flex; gap: 8px; align-items: center; }
  .controls .hint { font-size: 12px; color: #9a8f82; flex: 1; }
  button.btn {
    background: #7a6a58; color: #f9f6f2; border: none;
    border-radius: 6px; padding: 8px 14px; font-size: 14px; font-weight: 700;
    cursor: pointer;
  }
  button.btn:active { transform: translateY(1px); }
  button.btn:disabled { opacity: 0.45; cursor: default; }
  /* ---- 게임판 ---- */
  .board-wrap { position: relative; width: 100%; max-width: 480px; }
  #game {
    width: 100%; aspect-ratio: 1 / 1; display: block;
    background: var(--board); border-radius: 10px;
    touch-action: none;
  }
  /* ---- 게임오버 오버레이 ---- */
  .overlay {
    position: absolute; inset: 0;
    background: rgba(238, 228, 218, 0.78);
    border-radius: 10px;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center;
  }
  .overlay.show { display: flex; }
  .overlay .over-title { font-size: 34px; font-weight: 800; color: #776e65; }
  .overlay .over-sub { font-size: 14px; color: #776e65; }
  /* ---- 토스트 ---- */
  .toast {
    position: fixed; left: 50%; top: 14px; transform: translateX(-50%) translateY(-20px);
    background: #edc22e; color: #fff; font-weight: 800; font-size: 14px;
    padding: 8px 16px; border-radius: 20px; opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s; z-index: 50;
    box-shadow: 0 4px 14px rgba(0,0,0,.18);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  /* 새 최고기록/마일스톤 플래시 */
  .board-wrap.flash::after {
    content: ""; position: absolute; inset: 0; border-radius: 10px;
    background: rgba(255,255,255,.55); pointer-events: none;
    animation: flashfade .5s ease-out forwards;
  }
  @keyframes flashfade { from { opacity: 1; } to { opacity: 0; } }
</style>
</head>
<body>

<!-- ============ 상단 광고 배너 ============ -->
<div class="ad-slot" id="ad-top" aria-label="광고 영역 상단"></div>

<div class="app">
  <div class="topbar">
    <div>
      <div class="title">2048 Merge</div>
      <div class="subtitle">무한 머지 퍼즐 · 같은 숫자를 합쳐라</div>
    </div>
    <div class="scores">
      <div class="score-box">
        <div class="score-label">점수</div>
        <div class="score-val" id="score">0</div>
      </div>
      <div class="score-box">
        <div class="score-label">최고</div>
        <div class="score-val" id="best">0</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <span class="hint">방향키 / WASD / 스와이프로 이동</span>
    <button class="btn" id="undo" aria-label="한 수 되돌리기" disabled>되돌리기</button>
    <button class="btn" id="restart" aria-label="새 게임 시작">새 게임</button>
  </div>

  <div class="board-wrap" id="board-wrap">
    <canvas id="game" width="480" height="480" aria-label="게임 보드"></canvas>
    <div class="overlay" id="overlay" role="dialog" aria-modal="true">
      <div class="over-title">게임 오버</div>
      <div class="over-sub" id="over-sub">더 이상 이동할 수 없어요</div>
      <button class="btn" id="retry" aria-label="다시하기">다시하기</button>
    </div>
  </div>
</div>

<!-- ============ 하단 광고 배너 ============ -->
<div class="ad-slot" id="ad-bottom" aria-label="광고 영역 하단"></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
